name: diag-mac

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  alone:
    name: failing five alone
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
      - name: run
        run: |
          cargo test -p ferrox-app --bin ferrox-app --locked -- \
            --exact \
            proxy::tests::socks_dials_ss_over_grpc_to_echo \
            proxy::tests::socks_dials_trojan_over_grpc_to_echo \
            proxy::tests::eight_downloads_finish_over_each_grpc_carrier \
            proxy::tests::vmess_tls_serves_tcp_over_every_carrier \
            proxy::tests::vmess_tls_serves_udp_over_every_carrier

  mixed:
    name: failing five with the five new
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
      - name: run
        run: |
          cargo test -p ferrox-app --bin ferrox-app --locked -- \
            --exact \
            proxy::tests::socks_dials_ss_over_grpc_to_echo \
            proxy::tests::socks_dials_trojan_over_grpc_to_echo \
            proxy::tests::eight_downloads_finish_over_each_grpc_carrier \
            proxy::tests::vmess_tls_serves_tcp_over_every_carrier \
            proxy::tests::vmess_tls_serves_udp_over_every_carrier \
            proxy::tests::a_vmess_kcp_mux_carries_a_tcp_stream \
            proxy::tests::shadowsocks2022_mux_carries_a_stream_through_one_session \
            proxy::tests::shadowsocks2022_mux_carries_a_datagram_through_one_session \
            proxy::tests::a_shadowsocks_ws_mux_carries_a_tcp_stream \
            proxy::tests::a_socks_udp_association_rides_a_vless_ws_mux_session

[sources.xray-core]
repo          = "https://github.com/XTLS/Xray-core"
rev           = "7c8dbcb4bbec7f80d16070069e0b2f7bf3aca62c"
always        = true
default_branch = "main"
path          = "common/crypto"
test_enabled  = true
suite         = "go test -count=1 -timeout 20m -run '^(TestHttpConformance|TestHttpError|TestHTTPConnectMethod|TestHttpPost|TestSocksBridgeTCP|TestSocksWithHttpRequest|TestSocksConformanceMod|TestSocksBridageUDP|TestSocksBridageUDPWithRouting|TestDokodemoTCP|TestDokodemoUDP|TestResolveIP|TestPassiveConnection|TestBlackhole|TestVMessClosing|TestZeroBuffer|TestShadowsocksChaCha20Poly1305TCP|TestShadowsocksAES256GCMTCP|TestShadowsocksAES128GCMUDP|TestShadowsocksAES128GCMUDPMux|TestShadowsocks2022Tcp|TestShadowsocks2022UdpAES128|TestShadowsocks2022UdpAES256|TestShadowsocks2022UdpChacha|TestSimpleTLSConnection|TestSimpleTLSConnectionPinned|TestSimpleTLSConnectionPinnedWrongCert|TestUTLSConnectionPinned|TestUTLSConnectionPinnedWrongCert|TestVless|TestVlessTls|TestVlessXtlsVision|TestVlessXtlsVisionReality|TestVlessRealityFingerprints|TestVMessGCM|TestVMessGCMReadv|TestVMessChacha20|TestMasque|TestMasqueHTTP2|TestMasqueServer|TestMasqueServerRejectsWrongPassword|TestMasqueServerHTTP2|TestMasqueServerClientToClient|TestWireguard|TestCommanderListenConfigurationItem|TestCommanderRemoveHandler|TestCommanderListHandlers|TestCommanderAddRemoveUser|TestCommanderStats)$' ./testing/scenarios"
ferrox_binary = "ferrox-app"
seam          = "BuildXray"
harness       = "scripts/xray-scenarios.sh"
note          = "Xray-core at this pin. The unit tests are in-process with no seam; testing/scenarios builds main at run time (BuildXray) and spawns it with -config=stdin: -format=pb (common_regular.go), so scripts/xray-scenarios.sh builds that package with go's -overlay, main.go replaced by a launcher that execs ferrox-app. The package holds 73 tests across 17 families; the scenario map at this pin answers 44, and the gate names 49: those 44 across http (4), socks (5), dokodemo (2), dns (1), feature (2), policy (2), shadowsocks (8), tls (5), vless (5), vmess (3), masque (6) and wireguard (1), plus the five commander tests. The shadowsocks eight are the four legacy AEAD runs plus the four Shadowsocks-2022 runs (TCP and UDP for aes-128-gcm, aes-256-gcm and chacha20-poly1305), which the xray.proxy.shadowsocks_2022 decode in xray_pb.rs carries. The map still runs all 73 without gating: 20 fail and 9 carry no verdict. TestHttpBasicAuth stays out because the account map is refused by name; the remaining failures need KCP, WebSocket/gRPC transports, auto-issued certificates, forward/dialerProxy, observability, reverse or VMess length-auth. There is no trojan scenario file at this pin, so trojan's conformance is the Zray oracle seam below. The full list runs in xray-baseline.yml. The commander five cover listen and routed-outbound roles, RemoveInbound, ListInbounds/ListOutbounds, VMess user add/remove, and the policy-gated stats counters."


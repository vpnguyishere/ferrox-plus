[sources.xray-rust]
repo          = "https://github.com/aimalygin/xray-rust"
rev           = "75457fe68298fd345a5fe4ff1afbe22b15a97687"
topics        = "interop, balancer, round robin, proxy chain"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "git init -q Xray-core && git -C Xray-core fetch --quiet --depth 1 https://github.com/XTLS/Xray-core 1b1647cd9ddf0abc34b981d4611fc03bcac1ca74 && git -C Xray-core checkout --quiet FETCH_HEAD && FERROX_ECHO_TRACE=1 cargo test -p xray-core-rs --test local_xray_interop_tests -- --ignored --exact --test-threads=1 rust_socks_client_reaches_echo_server_through_local_xray_vless_tcp rust_round_robin_balancer_uses_each_local_xray_vless_member rust_two_hop_proxy_chain_reaches_echo_through_local_xray_vless_servers rust_socks_client_reaches_echo_server_through_local_xray_vless_ws rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade rust_socks_client_reaches_echo_server_through_local_xray_vless_ws_early_data rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade_early_data rust_socks_client_reaches_echo_server_through_local_xray_vless_ws_tls rust_socks_client_reaches_echo_server_through_local_xray_vless_tls rust_socks_client_reaches_echo_server_through_local_xray_vless_reality_vision rust_socks_client_reaches_echo_server_through_local_xray_vless_tls_vision inner_tls_session_survives_vision_direct_switch_through_local_xray_reality_vision rust_socks_client_reaches_echo_server_through_local_xray_vless_reality_vision_selected_fingerprints rust_socks_clients_open_parallel_echo_flows_through_local_xray_vless_reality_vision_selected_fingerprints xray_core_socks_clients_open_parallel_echo_flows_through_local_xray_vless_reality_vision_selected_fingerprints rust_socks_client_reaches_echo_server_through_local_xray_vless_grpc_reality rust_socks_client_reaches_echo_server_through_local_xray_vless_grpc rust_socks_client_reaches_echo_server_through_local_xray_vless_grpc_tls rust_socks_client_streams_bulk_echo_through_local_xray_vless_grpc_multi_mode rust_socks_client_reads_a_server_greeting_through_local_xray_vless_grpc inner_tls_session_survives_vision_direct_switch_through_local_xray_tls_vision rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade_tls fragment_finalmask_tls_interop fragment_finalmask_tls_vision_direct_interop"
ferrox_binary = "ferrox-app"
seam           = "XRAY_VLESS_FULL_BINARY"
note          = "Rust VLESS core; 24 of local_xray_interop_tests.rs's 29 interop tests run against ferrox-app via XRAY_VLESS_FULL_BINARY, checked by conformance.yml. Of the 5 that stay out, three dial a live origin (the two REALITY fragment rows and the xhttp matrix's REALITY-H2 case), one needs an owner-supplied remote profile, and udp_noise_xhttp_h3 drives QUIC flows this binary has no UDP leg for. The sixth that used to stay out, the multi-mode gRPC bulk row, was a defect and is now a measurement: the inbound served only `Tun`, so a `TunMulti` call was reset, and its megabyte downlink is what proves the batched read path delivers every element. Suite fetches the Xray-core checkout the tests assert on because the harness clones only this repo"

[sources.xray-rust-hysteria]
repo          = "https://github.com/aimalygin/xray-rust"
rev           = "75457fe68298fd345a5fe4ff1afbe22b15a97687"
topics        = "hysteria"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "cargo test -p xray-transport --test hysteria_interop_tests -- --ignored --exact pinned_reference_rejects_wrong_auth_and_closes_failed_tcp_destination"
ferrox_binary = "ferrox-app"
seam          = "XRAY_HYSTERIA_BINARY"
note          = "the same core's Hysteria v2 client against ferrox-app's `protocol: hysteria` inbound: a wrong password is refused and a failed destination closes after the acknowledgement. UDP stays out — ferrox carries no UDP flows, and the two tests that need them name that refusal. The harness's readiness token is the pinned Xray banner; ferrox-app emits it labeled as the harness's string. Read from `upstream/xray-rust`: one checkout for the commit both pins name, this name links to it"

